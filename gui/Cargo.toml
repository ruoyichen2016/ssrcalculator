# Separate workspace: keeps eframe's dependency graph out of the core workspace
# entirely (the core `cargo build` does not even resolve it).
[workspace]

[package]
name = "springsharp-gui"
version = "0.3.0"
edition = "2021"
publish = false
description = "Optional egui/eframe GUI for the SpringSharp Rust engine"
license = "MIT"

[[bin]]
name = "springsharp-gui"
path = "src/main.rs"

[dependencies]
springsharp = { path = ".." }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

# Profiles are per-workspace, so this repeats the core `../Cargo.toml` policy:
# line tables for the GUI crate itself, none at all for the ~300-crate eframe
# tree (which dominates the cache).
[profile.dev]
debug = "line-tables-only"

# The eframe/egui dependency tree does not need debug symbols; this keeps the
# isolated GUI cache much smaller.
[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"
