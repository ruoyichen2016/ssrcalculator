# Separate workspace: keeps eframe's dependency graph out of the core workspace
# entirely (the core `cargo build` does not even resolve it).
[workspace]

[package]
name = "springsharp-gui"
default-run = "springsharp-gui"
version = "0.3.0"
edition = "2021"
publish = false
description = "Optional egui/eframe GUI for the SpringSharp Rust engine"
license = "MIT"

[[bin]]
name = "springsharp-gui"
path = "src/main.rs"

[[bin]]
name = "springsharp-web"
path = "src/web_main.rs"

[dependencies]
springsharp = { path = ".." }
rfd = "0.17.2"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "links", "x11", "wayland"] }

# Profiles are per-workspace, so this repeats the core `../Cargo.toml` policy:
# line tables for the GUI crate itself, none at all for the ~300-crate eframe
# tree (which dominates the cache).
[profile.dev]
debug = "line-tables-only"

# The eframe/egui dependency tree does not need debug symbols; this keeps the
# isolated GUI cache much smaller.
[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
# Use the same OpenType parser as egui to verify bundled fallback coverage.
skrifa = "0.44"
