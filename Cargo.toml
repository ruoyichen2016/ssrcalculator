[package]
name = "springsharp"
version = "0.1.0"
edition = "2021"
default-run = "springsharp"
description = "A Rust reimplementation of the SpringSharp naval design calculation engine"
license = "MIT"

[lib]
name = "springsharp"
path = "src/lib.rs"

[[bin]]
name = "springsharp"
path = "src/main.rs"

[[bin]]
name = "springsharp-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
