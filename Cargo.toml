[package]
name = "springsharp"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
default-run = "springsharp"
description = "A Rust reimplementation of the SpringSharp naval design calculation engine"
license = "MIT"
readme = "README.md"

# The core is its own workspace with no dependencies, so `cargo build`/`test`
# here never resolves eframe.  The GUI lives in `gui/` as a *separate* workspace
# that depends on this crate by path; build it with `scripts/build-gui.sh` (which
# pins CARGO_TARGET_DIR=target-gui) or from inside `gui/`, which
# `gui/.cargo/config.toml` redirects to that same cache.
[workspace]
members = ["."]
exclude = ["gui"]
resolver = "2"

[lib]
name = "springsharp"
path = "src/lib.rs"

[[bin]]
name = "springsharp"
path = "src/main.rs"

# Debug info: keep file/line tables so panics and backtraces stay actionable,
# but drop the much larger type/variable-level DWARF.  Measured on this crate
# via `cargo build --all-targets`: `target/` 158 MB -> 111 MB with no measurable
# build-time cost.  `debug = 0` would reach ~77 MB but leaves backtraces without
# line numbers, which is a bad trade for a numerics engine.
[profile.dev]
debug = "line-tables-only"

# Dependencies (notably the optional eframe/egui GUI tree) do not need debug
# symbols at all; this keeps the dependency artifacts much smaller.
[profile.dev.package."*"]
debug = false

# Release tuning: the engine is pure scalar maths, so thin LTO + a single codegen
# unit buys a few percent at no real cost, and stripping keeps the CLI binary
# small.  `panic` stays `unwind` because the web console relies on catch_unwind.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
