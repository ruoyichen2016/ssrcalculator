[package]
name = "springsharp"
version = "0.2.0"
edition = "2021"
default-run = "springsharp"
description = "A Rust reimplementation of the SpringSharp naval design calculation engine"
license = "MIT"
readme = "README.md"

# The core is its own workspace with no dependencies, so `cargo build`/`test`
# here never resolves eframe.  The GUI lives in `gui/` as a *separate* workspace
# that depends on this crate by path; build it with `scripts/build-gui.sh` or
# `cargo build --manifest-path gui/Cargo.toml`.
[workspace]
members = ["."]
exclude = ["gui"]
resolver = "2"

[lib]
name = "springsharp"
path = "src/lib.rs"

[[bin]]
name = "springsharp"
path = "src/main.rs"

# Dependencies (notably the optional eframe/egui GUI tree) do not need debug
# symbols; this keeps the dependency artifacts much smaller.  The crate itself
# keeps its normal debug info.
[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"
