name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  gui-build:
    name: GUI feature build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # eframe/egui with the glow + x11 + wayland backends needs the X11,
      # xkbcommon and Wayland development packages.
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Format GUI
        run: cargo fmt --manifest-path gui/Cargo.toml -- --check

      - name: Clippy GUI
        run: cargo clippy --manifest-path gui/Cargo.toml --all-targets -- -D warnings

      - name: Build GUI binary
        run: cargo build --manifest-path gui/Cargo.toml
